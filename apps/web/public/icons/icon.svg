<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    CoFounderBay mark β€” "two founders, one bay".
    Same geometry as components/brand/Logo.tsx so the favicon, PWA icon and
    in-app logo are one shape. Colours are the light-theme primary
    (hsl 236 72% 55%) because a favicon cannot read CSS variables.
  -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a45df"/>
      <stop offset="100%" stop-color="#3a45df" stop-opacity="0.82"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="#3a45df"/>
  <rect width="32" height="32" rx="9" fill="url(#badge)"/>
  <rect width="32" height="32" rx="9" fill="url(#sheen)"/>
  <path d="M8.5 11.5 C8.5 20 13.5 23.5 16 24.5 C18.5 23.5 23.5 20 23.5 11.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.92"/>
  <circle cx="8.5" cy="10.5" r="3.1" fill="#ffffff"/>
  <circle cx="23.5" cy="10.5" r="3.1" fill="#ffffff"/>
  <circle cx="16" cy="24.5" r="1.9" fill="#ffffff" opacity="0.9"/>
</svg>
